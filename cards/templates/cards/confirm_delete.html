{% extends 'cards/base.html' %}

{% block content %}
<div class="container mt-4">
    <div class="card border-danger">
        <div class="card-header bg-danger text-white">
            <h4><i class="bi bi-exclamation-triangle"></i> Подтвердите удаление</h4>
        </div>
        <div class="card-body">
            <h5>Вы действительно хотите удалить {{ type }}?</h5>
            <div class="alert alert-warning mt-3">
                <strong>"{{ object }}"</strong>
                {% if type == 'урок' and object.cards.exists %}
                <div class="mt-2">
                    <i class="bi bi-exclamation-circle"></i>
                    Будет также удалено карточек: <strong>{{ object.cards.count }}</strong>
                </div>
                {% endif %}
            </div>

            <form method="post">
                {% csrf_token %}
                <div class="d-grid gap-2 d-md-flex justify-content-md-end mt-4">
                    <a href="{% if back_kwargs %}{% url back_url back_kwargs.pk %}{% else %}{% url back_url %}{% endif %}" 
                       class="btn btn-secondary me-md-2">
                        <i class="bi bi-arrow-left"></i> Отмена
                    </a>
                    <button type="submit" class="btn btn-danger">
                        <i class="bi bi-trash"></i> Удалить
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
